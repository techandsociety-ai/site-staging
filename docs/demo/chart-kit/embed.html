<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>CHIP50 chart</title>
<style>html,body{margin:0;background:#fff}#c svg{display:block;width:100%;height:auto}</style>
</head>
<body>
<div id="c"></div>
<script src="kit.js"></script>
<script>
var id = new URLSearchParams(location.search).get('chart') || 'tiktok-age-w38';
CHIP50Kit.load(id).then(function (spec) {
  CHIP50Kit.mount(document.getElementById('c'), spec, {bg: 'surface', onRender: function (h) {
    parent.postMessage({chip50: 'height', chart: id, height: h}, '*');
  }});
});
</script>
</body>
</html>
