<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>CHIP50 chart</title>
<style>html,body{margin:0;background:#fff}#c svg{display:block;width:100%;height:auto}</style>
</head>
<body>
<div id="c"></div>
<script src="kit.js"></script>
<script>
var qs = new URLSearchParams(location.search);
var id = qs.get('q') || 'tiktok-w38', v = qs.get('view') === 'states' ? 'states' : 'by';
var slug = /^[a-z-]+$/.test(qs.get('state') || '') ? qs.get('state') : null;
CHIP50Kit.load(id).then(function (q) {
  CHIP50Kit.mount(document.getElementById('c'), CHIP50Kit.view(q, v, slug), {bg: 'surface', onRender: function (h) {
    parent.postMessage({chip50: 'height', chart: id, height: h}, '*');
  }});
});
</script>
</body>
</html>
