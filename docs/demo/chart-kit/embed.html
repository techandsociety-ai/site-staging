<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>CHIP50 chart</title>
<style>html,body{margin:0;background:#fff}#c svg{display:block;width:100%;height:auto}</style>
</head>
<body>
<div id="c"></div>
<script src="kit.js"></script>
<script>
var qs = new URLSearchParams(location.search);
var id = qs.get('q') || 'tiktok-w38', v = qs.get('view') === 'states' ? 'states' : 'by';
var slug = /^[a-z-]+$/.test(qs.get('state') || '') ? qs.get('state') : null;
function show(spec) {
  CHIP50Kit.mount(document.getElementById('c'), spec, {bg: 'surface', onRender: function (h) {
    parent.postMessage({chip50: 'height', chart: id, height: h}, '*');
  }});
}
/* view=questions charts one place across every question in the set q names */
if (qs.get('view') === 'questions') CHIP50Kit.loadSet(qs.get('q')).then(function (s) { show(CHIP50Kit.across(s.questions, slug, s.index)); });
else CHIP50Kit.load(id).then(function (q) { show(CHIP50Kit.view(q, v, slug)); });
</script>
</body>
</html>
