<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Matrix explorer — CHIP50</title>
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<meta name="color-scheme" content="light dark"/>
<link rel="stylesheet" href="../../assets/report.css"/>
<style>
/* An app page, not a report: full width, sans, dense, tabular figures.
   Cells are coloured by points from the U.S. (the default) or by share,
   both drawn in the script per theme. Points use orange (below the U.S.)
   and blue (above) through a grey midpoint: a colourblind-safe pair that
   doesn't read as red/blue partisanship, kept light enough for dark ink. */
:root{--below-ink:#a84800;--above-ink:#1c5cab}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme=light])){--below-ink:#f5a465;--above-ink:#86b6ef}}
:root[data-theme=dark]{--below-ink:#f5a465;--above-ink:#86b6ef}
body{font:400 14px/1.45 var(--sans);font-variant-numeric:tabular-nums}
.mono{font:500 12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.up{color:var(--above-ink)} .down{color:var(--below-ink)}

/* ---------- sticky bar: the two filters, side by side ---------- */
.xbar{position:sticky;top:0;z-index:70;display:flex;align-items:center;gap:14px;padding:9px 24px;height:64px;
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--rule)}
.brand{display:flex;flex-direction:column;gap:2px;flex:none;margin-right:4px;text-decoration:none}
.brand b{font:650 14px/1 var(--sans);color:var(--ink);display:flex;align-items:center;gap:7px}
.brand b::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--acc)}
.brand span{font:500 11.5px/1 var(--sans);color:var(--muted);padding-left:16px}
.setpick{display:flex;flex-direction:column;gap:3px;flex:none}
.setpick label{font:650 10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.setpick select{font:600 13px/1.2 var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:5px 8px}
.field{position:relative;width:320px;flex:none}
.field label{position:absolute;left:12px;top:6px;font:650 10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);pointer-events:none}
.field input{width:100%;font:600 15px/1.2 var(--sans);color:var(--ink);background:var(--surface);
  border:1px solid var(--rule);border-radius:9px;padding:20px 40px 7px 12px;outline:none}
.field input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.field>kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
kbd{font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);border:1px solid var(--rule);
  border-bottom-width:2px;border-radius:5px;padding:2px 5px;background:var(--surface)}
.xbar .tools{margin-left:auto;display:flex;gap:10px;align-items:center;flex:none}
.keys{display:flex;gap:11px;align-items:center;font:400 12px/1 var(--sans);color:var(--muted)}
.keys span{white-space:nowrap}
@media (max-width:1900px){.xbar .keys .wide{display:none}}
@media (max-width:1600px){.xbar .keys{display:none}}

/* ---------- flyouts: the pickers are small charts ---------- */
.fly{position:absolute;left:0;top:calc(100% + 7px);z-index:120;background:var(--surface);border:1px solid var(--rule);border-radius:12px;
  box-shadow:0 18px 48px rgba(0,0,0,.18);display:none;padding:6px 6px 0}
.field.open .fly{display:block}
#fq .fly{width:600px} #fp .fly{width:640px}
.fh{display:flex;align-items:center;gap:10px;padding:6px 8px 8px;font:400 12.5px/1.3 var(--sans);color:var(--muted)}
.fh b{color:var(--ink);font-weight:650}
.fh .sp{flex:1}
.cols,.row{display:grid;align-items:center;gap:0 10px;padding:0 8px}
.qc{grid-template-columns:minmax(0,1fr) 150px 52px 46px 50px}
.pc{grid-template-columns:22px minmax(0,1fr) 150px 52px 50px 52px}
.cols{font:650 10.5px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--rule2)}
.cols .r,.row .r{text-align:right}
.fl{max-height:min(60vh,540px);overflow:auto;padding:3px 0}
.row{height:27px;border-radius:6px;cursor:pointer;font:400 13px/1 var(--sans);color:var(--ink2)}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.row .rk{color:var(--muted);font-size:11.5px}
.row .v{font-weight:650;color:var(--ink);text-align:right}
.row .g,.row .nn{text-align:right;font-size:12px}
.row .nn{color:var(--muted)}
.row svg{display:block;width:100%;height:12px}
.row.hi{background:var(--soft)}
.row.cur .nm{font-weight:700}
.row.cur .nm::after{content:" ●";color:var(--acc);font-size:9px}
.empty{padding:14px 10px;color:var(--muted);margin:0}
.ff{display:flex;gap:14px;flex-wrap:wrap;padding:8px;border-top:1px solid var(--rule2);font:400 11.5px/1.2 var(--sans);color:var(--muted)}

main.app{max-width:none;padding:16px 24px 80px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px 16px 12px}
.ph{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.ph h2{font:650 16px/1.3 var(--sans);letter-spacing:-.005em;margin:0;color:var(--ink)}
.ph h2::before{display:none}
.ph p{font:400 12.5px/1.45 var(--sans);color:var(--muted);margin:2px 0 0}
.ph .grow{flex:1;min-width:280px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;flex:none}
.seg button{font:500 12px/1 var(--sans);color:var(--ink2);background:transparent;border:0;padding:7px 9px;cursor:pointer}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed=true]{background:var(--soft);color:var(--acct);font-weight:650}
.ctl{display:flex;align-items:center;gap:7px;font:500 12px/1 var(--sans);color:var(--muted);flex:none}
.btn.sm{font-size:12px;padding:6px 9px}

/* ---------- the matrix ---------- */
#grid{position:relative;outline:none;border-radius:8px;transition:box-shadow .12s}
#grid:focus{box-shadow:0 0 0 2px var(--acc),0 0 0 6px color-mix(in srgb,var(--acc) 20%,transparent)}
#grid svg{display:block;width:100%;height:auto;user-select:none}
#grid [data-c]{cursor:pointer}
.legend{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;margin-top:9px;font:400 12px/1.4 var(--sans);color:var(--muted)}
.scale{position:relative;width:300px;height:27px;font:400 11px/1 var(--sans);color:var(--muted)}
.scale .bar{position:absolute;left:0;right:0;top:0;height:11px;border-radius:3px}
.scale span{position:absolute;top:15px;transform:translateX(-50%);white-space:nowrap}
.scale span:first-of-type{transform:none}
.scale span:last-of-type{transform:translateX(-100%)}
.legend[hidden],.panel[hidden]{display:none}

/* the selected row, pinned under the bar once it scrolls out of view */
.pin{position:fixed;top:64px;z-index:65;display:none;box-sizing:border-box;padding:6px 16px 8px;
  background:color-mix(in srgb,var(--surface) 95%,transparent);backdrop-filter:blur(8px);
  border:1px solid var(--rule);border-top:0;border-radius:0 0 12px 12px;box-shadow:0 10px 24px rgba(0,0,0,.10)}
.pin.on{display:block}
.pin svg{display:block;width:100%;height:auto;user-select:none}
.pin [data-c]{cursor:pointer}
#tip{position:fixed;z-index:130;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 10px;
  font:400 12.5px/1.45 var(--sans);box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;max-width:300px}
#tip b{font-weight:650}
#tip .t{opacity:.75}

/* ---------- detail for the selected pair ---------- */
.dhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:22px 2px 12px}
.dhead h2{font:700 20px/1.2 var(--sans);letter-spacing:-.015em;margin:0}
.dhead h2::before{display:none}
.dhead p{margin:0;font:400 12.5px/1.4 var(--sans);color:var(--muted)}
.detail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:1400px){.detail{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.chart-el svg{display:block;width:100%;height:auto}
.click [data-key]{cursor:pointer}
.click [data-key]:hover{fill:color-mix(in srgb,var(--ink) 7%,transparent)}
.ct{font:650 14.5px/1.3 var(--sans);color:var(--ink);margin:0}
.cs{font:400 12.5px/1.45 var(--sans);color:var(--muted);margin:2px 0 12px}
.out{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--rule2)}
.out .lab{font:600 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.out a.btn{text-decoration:none}
.emb{display:none;margin-top:8px}
.emb.on{display:flex;gap:8px;align-items:flex-start}
.emb pre{flex:1;min-width:0;margin:0;background:var(--bg);border:1px solid var(--rule);border-radius:8px;
  padding:8px 10px;color:var(--ink2);white-space:pre-wrap;word-break:break-all}
dl.notes{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;margin:0;font:400 13px/1.5 var(--sans)}
dl.notes dt{color:var(--muted)}
dl.notes dd{margin:0;color:var(--ink)}
dl.notes code{white-space:normal;font-size:11.5px;display:inline-block;margin-bottom:2px;word-break:break-word}
.radio{margin:12px 0 6px;padding:10px 12px;background:var(--soft);border-radius:8px;font:400 13.5px/1.5 var(--sans);color:var(--ink)}
.pos{font:400 12.5px/1.5 var(--sans);color:var(--muted);font-style:italic;margin:10px 0 0}

</style>
</head>
<body>
<header class="xbar">
  <a class="brand" href="../../index.html"><b>CHIP50</b><span>Matrix explorer</span></a>
  <div class="setpick"><label for="setSel">Topic</label><select id="setSel"></select></div>
  <div class="field" id="fq">
    <label for="qi">Item</label>
    <input id="qi" role="combobox" aria-expanded="false" aria-controls="ql" aria-autocomplete="list" autocomplete="off" spellcheck="false">
    <kbd>/</kbd>
    <div class="fly">
      <div class="fh" id="qh"></div>
      <div class="cols qc" id="qcols"></div>
      <div class="fl" id="ql" role="listbox" aria-label="Items"></div>
      <div class="ff"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>Enter</kbd> choose</span><span><kbd>Esc</kbd> close</span><span><kbd>j</kbd> <kbd>k</kbd> step without opening</span></div>
    </div>
  </div>
  <div class="field" id="fp">
    <label for="pi">Place</label>
    <input id="pi" role="combobox" aria-expanded="false" aria-controls="pl" aria-autocomplete="list" autocomplete="off" spellcheck="false">
    <kbd>s</kbd>
    <div class="fly">
      <div class="fh" id="ph"></div>
      <div class="cols pc" id="pcols"></div>
      <div class="fl" id="pl" role="listbox" aria-label="Places"></div>
      <div class="ff"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>Enter</kbd> choose</span><span><kbd>Esc</kbd> close</span><span><kbd>h</kbd> <kbd>l</kbd> step along the columns without opening</span><span><kbd>u</kbd> United States</span></div>
    </div>
  </div>
  <div class="tools">
    <div class="keys" aria-label="Keyboard shortcuts">
      <span><kbd>j</kbd><kbd>k</kbd> item</span><span><kbd>h</kbd><kbd>l</kbd> place</span><span><kbd>g</kbd> grid</span>
      <span class="wide"><kbd>/</kbd><kbd>s</kbd> search</span><span class="wide"><kbd>u</kbd> U.S.</span>
    </div>
    <button class="btn" id="tt" aria-label="Toggle dark mode">Theme</button>
  </div>
</header>

<main class="app">
  <div class="gridcol" id="gridcol">
  <section class="panel" aria-labelledby="gh">
    <div class="ph">
      <div class="grow">
        <h2 id="gh">Every platform in every state</h2>
        <p id="gsub"></p>
      </div>
      <div class="ctl">Colour
        <div class="seg" role="group" aria-label="Colour cells by">
          <button type="button" data-shade="gap" aria-pressed="true" title="Points above or below the U.S., full colour at 15 points on every row">vs U.S.</button>
          <button type="button" data-shade="share" aria-pressed="false" title="Share of the base, 0 to 100% on every row">Share</button>
        </div>
      </div>
      <div class="ctl">Columns
        <div class="seg" role="group" aria-label="Order columns by">
          <button type="button" data-order="rank" aria-pressed="true" id="rankBtn">Rank</button>
          <button type="button" data-order="region" aria-pressed="false" title="Census regions, most populous state first">Region</button>
          <button type="button" data-order="vote24" aria-pressed="false" class="ctxonly" hidden title="Most Republican 2024 vote first">2024 vote</button>
          <button type="button" data-order="party" aria-pressed="false" class="ctxonly" hidden title="Most Republican party ID first">Party ID</button>
        </div>
      </div>
      <div class="ctl">Rows
        <div class="seg" role="group" aria-label="Order rows by">
          <button type="button" data-rows="us" aria-pressed="true" title="Highest U.S. share first">U.S. share</button>
          <button type="button" data-rows="spread" aria-pressed="false" title="Most states that differ from the U.S. first">Spread</button>
          <button type="button" data-rows="r" aria-pressed="false" class="corronly" hidden title="Rank correlation with the 2024 vote, highest first">r with vote</button>
        </div>
      </div>
      <button class="btn sm" type="button" id="gridCsv">CSV</button>
    </div>
    <div id="grid" tabindex="0" role="application" aria-label="The grid: every item by place. Arrow keys move the selection; g focuses it."></div>
    <div class="pin" id="pin" aria-hidden="true"></div>
    <div class="legend">
      <div id="ramp"></div>
      <span id="noise"></span>
    </div>
    <div class="legend" id="ctxLegend" hidden>
      <div id="pramp" class="scale"></div>
      <span id="ctxNote"></span>
    </div>
  </section>
  </div>

  <div class="detailcol">
    <div class="dhead"><h2 id="dh"></h2><p id="dp"></p></div>
    <div class="detail">
      <div class="stack">
        <section class="panel" id="pScatter" hidden></section>
        <section class="panel" id="pBy"></section>
        <section class="panel" id="pRadio"></section>
      </div>
      <div class="stack">
        <section class="panel click" id="pAcross"></section>
        <section class="panel" id="pNotes"></section>
      </div>
      <div class="stack"><section class="panel click" id="pStates"></section></div>
    </div>
  </div>
</main>
<div id="tip" role="tooltip"></div>

<script src="../../assets/report.js"></script>
<script src="kit.js"></script>
<script>
(function () {
  'use strict';
  const K = CHIP50Kit, $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  /* screenshot hook: ?theme=dark|light */
  if (/^(dark|light)$/.test(params.get('theme') || '')) document.documentElement.setAttribute('data-theme', params.get('theme'));

  /* Census regions, each in order of 2020 Census population */
  const REGIONS = [
    ['Northeast', 'NY PA NJ MA CT NH ME RI VT'],
    ['Midwest', 'IL OH MI IN MO WI MN IA KS NE SD ND'],
    ['South', 'TX FL GA NC VA TN MD SC AL LA KY OK AR MS WV DE DC'],
    ['West', 'CA WA AZ CO OR UT NV NM ID HI MT AK WY']
  ].map(([name, s]) => ({name, abbrs: s.split(' ')}));
  const SPAN = K.SPAN;   /* vs U.S.: full colour at this many points either side */
  const setName = /^[a-z0-9-]+$/.test(params.get('set') || '') ? params.get('set') : K.DEFAULT_SET;

  /* the share and points scales come from the kit (K.scales), so the matrix,
     the rails and the tile map colour alike; they're rebuilt per theme */
  let SCALE = [], DIV = [], HATCH = null, PS = null;
  function buildScale() { const sc = K.scales(); SCALE = sc.share; DIV = sc.div; HATCH = sc.hatch; PS = partisan(); }
  /* the state context rows' own scale: blue (Democratic) through grey to
     red (Republican), full colour at PSPAN points of margin; t runs -1 to 1 */
  const PSPAN = 30;
  function partisan() {
    const t0 = document.documentElement.getAttribute('data-theme');
    const dark = t0 ? t0 === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const [d, m, r] = dark ? ['#3d6da8', '#383835', '#a8463c'] : ['#7aa6e0', '#f0efec', '#e8877a'];
    const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
    const mix = (a, b, t) => rgb(a).map((v, i) => Math.round(v + (rgb(b)[i] - v) * t));
    return t => {
      t = Math.max(-1, Math.min(1, t));
      const c = t >= 0 ? mix(m, r, t) : mix(m, d, -t), lum = (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;
      return {fill: 'rgb(' + c.join(',') + ')', ink: lum > 0.55 ? '#14140f' : '#ffffff'};
    };
  }
  buildScale();
  /* Spearman's rank correlation: Pearson's r on the ranks, ties averaged */
  function ranks(a) {
    const ix = a.map((v, i) => [v, i]).sort((x, y) => x[0] - y[0]), out = new Array(a.length);
    for (let i = 0; i < ix.length;) {
      let j = i;
      while (j + 1 < ix.length && ix[j + 1][0] === ix[i][0]) j++;
      for (let k = i; k <= j; k++) out[ix[k][1]] = (i + j) / 2 + 1;
      i = j + 1;
    }
    return out;
  }
  function rho(x, y) {
    const a = ranks(x), b = ranks(y), n = a.length, ma = a.reduce((s, v) => s + v, 0) / n, mb = b.reduce((s, v) => s + v, 0) / n;
    let sab = 0, saa = 0, sbb = 0;
    for (let i = 0; i < n; i++) { sab += (a[i] - ma) * (b[i] - mb); saa += (a[i] - ma) ** 2; sbb += (b[i] - mb) ** 2; }
    return sab / Math.sqrt(saa * sbb);
  }
  const fmtR = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(2).replace(/^0/, '');
  /* a margin in points, positive for the Republican side */
  const margin = v => Math.abs(v) < 0.05 ? 'Even' : (v > 0 ? 'R+' : 'D+') + Math.abs(v).toFixed(1);
  const el = (tag, attrs, text) => {
    const e = document.createElement(tag);
    for (const a in attrs || {}) e.setAttribute(a, attrs[a]);
    if (text != null) e.textContent = text;
    return e;
  };
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const pct = K.pct, num = K.num;
  /* the value as printed (one decimal under 10%, else whole), so gaps are
     computed from what's on screen and the arithmetic adds up */
  const shown = v => v < 9.95 ? Math.round(v * 10) / 10 : Math.round(v);
  const gapOf = (v, us) => Math.round((shown(v) - shown(us)) * 10) / 10;
  const signed = g => (g > 0 ? '+' : g < 0 ? '−' : '±') + (Number.isInteger(g) ? Math.abs(g) : Math.abs(g).toFixed(1));
  const cls = g => g > 0 ? 'up' : g < 0 ? 'down' : '';
  /* Table 8's test, per cell: 1 if the state is above the U.S. by more than
     its 95% margin of error, -1 if below by more, 0 if the gap is inside it */
  const side = (q, st) => { const g = gapOf(st.value, q.us.value); return Math.abs(g) <= K.moe(st.value, st.n) ? 0 : g > 0 ? 1 : -1; };
  /* a mini bar on a 0–dom scale, with a tick at the U.S. share */
  function mini(v, ref, dom, soft) {
    const x = t => Math.max(0, Math.min(100, t / dom * 100));
    return '<svg viewBox="0 0 100 12" preserveAspectRatio="none" aria-hidden="true"><rect x="0" y="3" width="100" height="6" rx="3" style="fill:var(--rule2)"/>' +
      '<rect x="0" y="3" width="' + x(v) + '" height="6" rx="3" style="fill:' + (soft ? 'color-mix(in srgb,var(--acc) 45%,var(--surface))' : 'var(--acc)') + '"/>' +
      (ref != null ? '<rect x="' + (x(ref) - 0.7) + '" y="0" width="1.4" height="12" style="fill:var(--ink)"/>' : '') + '</svg>';
  }

  /* a set may name state context rows (context-<wave>.json: partisanship by
     state) to draw under its items */
  K.loadSet(setName).then(got => {
    const c = got.index.text && got.index.text.context;
    if (!c || !/^[a-z0-9-]+$/.test(c)) return Object.assign(got, {ctx: null});
    return fetch(c + '.json').then(r => r.ok ? r.json() : null).catch(() => null).then(ctx => Object.assign(got, {ctx}));
  }).then(({index, questions: Q, ctx}) => {
    const TX = index.text || {}, BASE = TX.base || 'adults';
    K.topicPicker($('setSel'), index.set);
    /* the set's own word for one of its items (an issue, a platform), for every label */
    const ITEM = TX.item || 'Item', NOUN = TX.noun || 'items', item = ITEM.toLowerCase();
    document.querySelector('label[for=qi]').textContent = ITEM;
    $('ql').setAttribute('aria-label', NOUN[0].toUpperCase() + NOUN.slice(1));
    $('grid').setAttribute('aria-label', 'Every ' + item + ' by place. Arrow keys move the selection; g focuses it.');
    document.querySelector('.keys span').innerHTML = '<kbd>j</kbd><kbd>k</kbd> ' + esc(item);
    K.flag($('gridcol'), index);
    const qById = new Map(Q.map(q => [q.id, q]));
    /* q.states[] is alphabetical by name and in the same order for every question */

      for (let v = Math.ceil(x0 / xstep) * xstep; v <= x1; v += xstep) {
        o.push('<line x1="' + X(v) + '" x2="' + X(v) + '" y1="' + T + '" y2="' + (H - B) + '" stroke-width="1" style="stroke:var(' + (v === 0 ? '--muted' : '--rule2') + ')"/>');
        o.push('<text x="' + X(v) + '" y="' + (H - B + 14) + '" text-anchor="middle" font-size="10.5" style="fill:var(--muted)">' + (v === 0 ? 'Even' : (v > 0 ? 'R+' : 'D+') + Math.abs(v)) + '</text>');
      }
      for (let v = y0; v <= y1; v += 5) {
        o.push('<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke-width="1" style="stroke:var(--rule2)"/>');
        o.push('<text x="' + (L - 6) + '" y="' + (Y(v) + 3.5) + '" text-anchor="end" font-size="10.5" style="fill:var(--muted)">' + v + '%</text>');
      }
      o.push('<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(q.us.value) + '" y2="' + Y(q.us.value) + '" stroke-width="1" stroke-dasharray="3 3" style="stroke:var(--ink2)"/>');
      o.push('<text x="' + (W - R) + '" y="' + (Y(q.us.value) - 4) + '" text-anchor="end" font-size="10.5" style="fill:var(--ink2)">U.S. ' + pct(q.us.value) + '</text>');
      o.push('<text x="' + (W - R) + '" y="' + (H - 4) + '" text-anchor="end" font-size="10.5" style="fill:var(--muted)">' + esc(c.label) + ' →</text>');
      q.states.forEach((s, i) => {
        const sd = side(q, s), sel = s.slug === cur.s;
        o.push('<text data-key="' + s.slug + '" x="' + X(xv[i]).toFixed(1) + '" y="' + (Y(s.value) + 3.5).toFixed(1) + '" text-anchor="middle" font-size="' + (sel ? 12 : 10) +
          '" font-weight="' + (sel ? 800 : 600) + '" style="cursor:pointer;fill:' + (sd > 0 ? 'var(--above-ink)' : sd < 0 ? 'var(--below-ink)' : 'var(--muted)') + '">' + s.abbr + '</text>');
      });
      o.push('</svg>');
      const answer = (TX.answer || '').replace('{phrase}', q.phrase || q.label);
      root.innerHTML = '<p class="ct">' + esc(q.label) + ' against ' + esc(c.label.toLowerCase()) + ', by state</p>' +
        '<p class="cs">Up: share of ' + esc(BASE) + ' who ' + esc(answer) + '. Across: ' + esc(c.long.charAt(0).toLowerCase() + c.long.slice(1)) +
        '. Colour: above or below the U.S. beyond the margin, as on the grid. r = ' + fmtR(q.rho[scX]) + ' (Spearman, ' + places.length + ' places).</p>' +
        '<div class="seg" style="margin-bottom:8px">' + CTX.map((x, j) => '<button type="button" data-sx="' + j + '" aria-pressed="' + (j === scX) + '">' + esc(x.label) + '</button>').join('') + '</div>' +
        '<div class="chart-el">' + o.join('') + '</div><p class="pos">Experimental. A correlation across states says nothing about individuals, and sampling error in each state estimate pulls r toward zero.</p>';
    }
    $('pScatter').addEventListener('click', e => {
      const sx = e.target.getAttribute && e.target.getAttribute('data-sx'), k = e.target.getAttribute && e.target.getAttribute('data-key');
      if (sx != null) { scX = +sx; render(); }
      else if (k && pBySlug.has(k)) select(cur.q, k === cur.s ? null : k);
    });
    /* radio copy and the range across states: short, so on a big screen it
       sits beside the by-age chart under the grid */
    function radio(q, st) {
      const root = $('pRadio');
      root.textContent = '';
      const ranked = q.states.slice().sort((a, b) => a.value - b.value), lo = ranked[0], hi = ranked[ranked.length - 1];
      root.appendChild(el('p', {'class': 'ct'}, 'Radio copy'));
      const rc = el('div', {'class': 'radio'}, K.view(q, 'by', st ? st.slug : null).radio);
      root.appendChild(rc);
      const b = el('button', {'class': 'btn sm', type: 'button'}, 'Copy radio copy');
      b.onclick = () => navigator.clipboard.writeText(rc.textContent).then(() => { b.textContent = 'Copied'; setTimeout(() => { b.textContent = 'Copy radio copy'; }, 1400); });
      root.appendChild(b);
      root.appendChild(el('p', {'class': 'cs', style: 'margin:12px 0 0'}, 'Across states, ' + q.label + ' runs from ' + pct(lo.value) + ' (' + lo.name + ') to ' +
        pct(hi.value) + ' (' + hi.name + '). ' + q.moe));
      root.appendChild(el('p', {'class': 'pos'}, 'Demo only. These numbers have not been through PI review for publication.'));
    }

    /* ---------- render everything for the current pair ---------- */
    function render() {
      const q = qById.get(cur.q), st = cur.s ? val(q, cur.s) : null;
      qFly.sync(); pFly.sync();
      const g = st ? gapOf(st.value, q.us.value) : null;
      $('gsub').textContent = (TX.subtitle || 'Share of adults') + ', ' + q.wave + ', ' + q.fielded +
        '. Click a cell for both; a row name or column head for one.';
      $('rankBtn').textContent = 'Rank on ' + q.label;
      drawGrid();
      $('dh').textContent = q.label + ' · ' + (st ? st.name : 'United States');
      /* the numbers for the pair, now that the bar carries only the two pickers */
      const where = st ? (side(q, st) === 0 ? 'within the margin of error' : g > 0 ? 'above the U.S.' : 'below the U.S.') : '';
      $('dp').textContent = pct(st ? st.value : q.us.value) + ' ' + K.pm(st ? st.value : q.us.value, st ? st.n : q.us.n) +
        (st ? ' · U.S. ' + pct(q.us.value) + ' · ' + signed(g) + ' pts, ' + where : '') +
        ' · ' + (st ? num(st.n) + ' ' + BASE + ' in ' + st.name : num(q.us.n) + ' U.S. ' + BASE) + ' answered';
      pBy.set(K.view(q, 'by', cur.s));
      pAcross.set(K.across(Q, cur.s, index));
      pStates.set(K.view(q, 'states', cur.s));
      notes(q, st);
      radio(q, st);
      scatter(q);
      document.title = q.label + ' · ' + (st ? st.name : 'U.S.') + ' — CHIP50 matrix explorer';
    }
    $('gh').textContent = TX.title || 'Every ' + item + ' in every state';
    const noise = () => {
      const sw = 'display:inline-block;width:22px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:6px;' +
        'background:repeating-linear-gradient(45deg,' + HATCH.stripe + ' 0 1.5px,' + HATCH.mid + ' 1.5px 6px)';
      $('noise').innerHTML = (shade === 'gap' ? '<span style="white-space:nowrap"><i style="' + sw + '"></i>Striped: the gap is inside that state\u2019s 95% margin of error.</span> ' : '') +
        'Margins as in the Work report\u2019s Table 8 (unweighted n; weighting widens them). ' + nLo + ' to ' + nHi + ' ' + esc(BASE) + ' per state.';
    };
    noise();
    /* the share colours are computed per theme, so a theme change redraws */
    const retheme = () => { buildScale(); drawRamp(); drawPartisan(); noise(); drawGrid(); };
    new MutationObserver(retheme).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
    drawRamp();
    drawPartisan();
    pressAll();
    render();
    rw = $('grid').clientWidth;
    /* ?open=question|place opens that picker on load; ?focus=grid focuses the grid */
    if (params.get('open') === 'question') qFly.focus();
    if (params.get('open') === 'place') pFly.focus();
    if (params.get('focus') === 'grid') $('grid').focus();
  }).catch(err => {
    document.querySelector('main').insertAdjacentHTML('afterbegin', '<p class="panel">Could not load this topic: ' + esc(err.message) + '</p>');
  });
})();
</script>
<script src="concepts.js"></script>
</body>
